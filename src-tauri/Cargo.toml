[package]
name = "kitnote"
version = "0.2.0"
description = "KitNote lightweight sticky-note desktop app"
authors = ["KitNote contributors"]
edition = "2021"
license = "MIT"
build = "build.rs"

[lib]
name = "kitnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "KitNote"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
