[package]
name = "kitnote"
version = "0.1.1"
description = "KitNote lightweight sticky-note desktop app"
authors = ["KitNote contributors"]
edition = "2021"
license = "MIT"
build = "build.rs"

[lib]
name = "kitnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "KitNote"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
